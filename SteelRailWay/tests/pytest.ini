[pytest]
# pytest configuration

# Test file matching patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Markers
markers =
    blackbox: blackbox tests
    whitebox: whitebox tests
    phase1: phase 1 tests
    phase2: phase 2 AI-assisted tests
    ai_assisted: AI-assisted property-based tests
    automated: automated module 2 tests
    performance: performance tests
    security: security tests
    integration: integration tests
    cuda: CUDA-specific tests (skipped if no GPU)

# Command line options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage configuration
[coverage:run]
source = ..
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = manual/phase1/coverage_reports

[pytest]
testpaths = tests/module1 tests/module2
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    blackbox: 黑盒测试
    whitebox: 白盒测试
    module1: 模块一测试基础实践
    module2: 模块二 AI 融合实践
    ai_assisted: AI 辅助属性测试
    automated: 自动化测试
    performance: 性能测试
    security: 安全测试
    integration: 集成测试
    cuda: 需要 CUDA 的测试
    slow: 耗时测试
addopts = -v --tb=short --strict-markers
